# The app's tests, by part (docs/building.md). A change runs only the parts it touches, plus
# strings and contracts. The tests that need no Mac run on Linux, with the oldest Swift the
# app supports. A Mac builds the app only when the app's own code, the scripts or this file
# change, since the organization has few Mac runners. The full suite runs each night.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      part:
        description: "One part to run (a folder of Tests/), or all"
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parts:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
      mac: ${{ steps.parts.outputs.mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The rule runs every part on the Mac for a pin move, shared code or a script
        run: |
          for path in shared.pin Sources/Core/base/Palette.swift Tests/Runner/Runner.swift scripts/test.sh; do
            out=$(printf '%s\n' "$path" | scripts/parts.sh)
            echo "$out" | grep -qx 'mac=true' || { echo "$path doesn't run the Mac"; exit 1; }
            echo "$out" | grep -q '^parts=.*shell' || { echo "$path doesn't run every part"; exit 1; }
          done
          # A change in one part alone still runs that part only, and on Linux only.
          out=$(printf 'Sources/Core/usage/Usage.swift\n' | scripts/parts.sh)
          echo "$out" | grep -qx 'mac=false' || { echo "a core-only change ran the Mac"; exit 1; }
          echo "$out" | grep -qx 'parts=contracts strings usage' || { echo "a core-only change ran: $out"; exit 1; }
      - name: The parts this change touches
        id: parts
        env:
          EVENT: ${{ github.event_name }}
          PART: ${{ inputs.part }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$EVENT" in
            schedule) scripts/parts.sh all ;;
            workflow_dispatch) scripts/parts.sh "${PART:-all}" ;;
            *) git diff --name-only "$BASE" HEAD | scripts/parts.sh ;;
          esac | tee -a "$GITHUB_OUTPUT"

  # The pin of the shared words and contracts isn't left behind kiff/tafs (docs/shared.md).
  drift:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The rule refuses 21 commits and 8 days, and takes 20 and 7
        run: |
          if scripts/shared.sh verdict 21 0; then echo "21 commits were taken"; exit 1; fi
          if scripts/shared.sh verdict 0 8; then echo "8 days were taken"; exit 1; fi
          scripts/shared.sh verdict 20 7
      - name: The pin is at most 20 commits and 7 days behind kiff/tafs main
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/shared.sh drift

  # What a Mac on macOS 12 builds with: Swift 5.7 and its SDK. Every file parses with Swift 5.7,
  # and no SwiftUI builder holds more than 10 views, which only that SDK refuses
  # (docs/building.md). On every change: it needs no Mac.
  swift57:
    runs-on: ubuntu-latest
    container: swift:5.7
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python for the builder check
        run: command -v python3 || (apt-get update -qq && apt-get install -y -qq python3)
      - name: The builder check catches a builder of 11
        run: |
          printf 'struct V: View {\n var body: some View {\n VStack {\n%s }\n }\n}\n' "$(for i in $(seq 11); do printf '  Text("%s")\n' $i; done)" > /tmp/eleven.swift
          if python3 scripts/viewbuilders.py /tmp/eleven.swift; then echo "a builder of 11 passed"; exit 1; fi
      - name: The shape check catches what Swift 5.7 refused on macOS 12
        run: |
          printf 'func a() {\n x.start { [weak self] v in\n  Task { @MainActor in self?.got(v) }\n }\n}\n' > /tmp/weak.swift
          if python3 scripts/swift57patterns.py /tmp/weak.swift; then echo "a weak self in a Task passed"; exit 1; fi
          printf 'func b() {\n Task {\n  defer { busy = false }\n  await go()\n }\n}\n' > /tmp/defer.swift
          if python3 scripts/swift57patterns.py /tmp/defer.swift; then echo "a defer in a Task passed"; exit 1; fi
      - name: Every file parses with Swift 5.7, no builder holds more than 10 views, and no shape Swift 5.7 refuses
        run: scripts/swift57.sh

  core:
    needs: parts
    if: needs.parts.outputs.parts != ''
    runs-on: ubuntu-latest
    container: swift:5.7
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tests that need no Mac
        env:
          PARTS: ${{ needs.parts.outputs.parts }}
        run: scripts/test.sh --core $PARTS

  mac:
    needs: parts
    if: needs.parts.outputs.mac == 'true' && needs.parts.outputs.parts != ''
    runs-on: macos-15
    # The native libraries take a few minutes when they're built, not restored.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Which Xcodes this runner has: a full Swift 5.7 build needs Xcode 14 (docs/building.md).
      - name: The Xcodes on this runner
        run: ls -d /Applications/Xcode*.app || true
      # libfido2, libcbor, libcrypto and libsecp256k1 as an earlier run of this same scripts/fido.sh built them
      # from checked source: the key is the script's hash, so a moved pin builds again. The
      # nightly run restores nothing and builds them from source.
      - name: The native libraries, as built before by this script
        if: github.event_name != 'schedule'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            build/fido/x86_64
            build/fido/arm64
            build/fido/licenses
          key: fido-${{ runner.os }}-${{ hashFiles('scripts/fido.sh') }}
      - name: The tools the library's build needs
        run: command -v pkg-config || HOMEBREW_NO_AUTO_UPDATE=1 brew install pkgconf
      - name: Build for Intel and Apple silicon
        run: |
          scripts/build.sh
          test "$(lipo -archs build/tafs.app/Contents/MacOS/tafs)" = "x86_64 arm64"
          for license in libfido2 libcbor openssl secp256k1; do
            test -s "build/tafs.app/Contents/Resources/licenses/$license.txt"
          done
      - name: The parts' tests, with the app's views
        env:
          PARTS: ${{ needs.parts.outputs.parts }}
        run: scripts/test.sh $PARTS
      # The screens the tests drew, so a pull request can show them: kept for 14 days.
      - name: The screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: build/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
