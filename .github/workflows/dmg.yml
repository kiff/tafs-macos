name: DMG

# The disk image a person downloads (docs/release.md): tafs.app for Intel and Apple
# silicon, signed with Developer ID and the hardened runtime, notarized by Apple,
# the ticket stapled, so it opens on a Mac on macOS 12 or later with no warning.
#
# - On a pull request that changes the packaging, `check` builds the image signed
#   ad hoc and opens it: no secret, no Apple.
# - By hand, from main, `release` makes the real one and attaches it to a draft
#   GitHub release of this repo, its only copy (a run artifact of a public repo
#   could be downloaded by any signed-in GitHub user),
#   `v<version>-<build>`: a draft is seen only by people with push access, so it
#   stays the team's until someone publishes it. It reads the Developer ID certificate (DEVELOPER_ID_P12,
#   DEVELOPER_ID_P12_PASSWORD) and the App Store Connect key notarization uses
#   (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8), all secrets of the `mac-signing`
#   environment (main only, a required reviewer), never repository secrets, so no
#   workflow on another branch can read them. It never prints any of them.
# - With `push` ticked, the release is built with alerts with tafs closed (`PUSH=1`):
#   scripts/push-profile.swift fetches, with the same App Store Connect key, the one
#   active Developer ID profile for bot.tafs.macos that gives push with the
#   certificate it signs with, and scripts/dmg.sh embeds it. Unticked, as before.

on:
  pull_request:
    paths: ["scripts/dmg.sh", "scripts/build.sh", "scripts/push-profile.swift", "App/Info.plist", "App/tafs.entitlements",
            "App/tafs-push.entitlements", ".github/workflows/dmg.yml"]
  workflow_dispatch:
    inputs:
      push:
        description: "Alerts with tafs closed (PUSH=1): embeds the Developer ID push profile"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the app, Intel and Apple silicon
        run: scripts/build.sh
      - name: Pack the image, signed ad hoc, and open it
        run: scripts/dmg.sh
      - name: The push profile's script type-checks
        run: swiftc -typecheck scripts/push-profile.swift

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: mac-signing
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The secrets are there
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in P12 P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            eval "[ -n \"\${$name}\" ]" || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. docs/release.md says how they're made and stored."
            exit 1
          fi

      - name: Build the app, Intel and Apple silicon
        env:
          PUSH: ${{ inputs.push && '1' || '0' }}
        run: scripts/build.sh

      - name: Import the Developer ID certificate into a keychain of this run's own
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$KEYCHAIN" > /dev/null
          # This run's keychain first, then the ones the runner had, so codesign finds the identity.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
          # Its certificate's SHA-1, public, for picking the push profile made for it.
          sha1=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/^ *[0-9]*) \([0-9A-F]\{40\}\) "Developer ID Application: .*/\1/p' | head -1)
          echo "CERT_SHA1=$sha1" >> "$GITHUB_ENV"
          echo "signing as $identity"

      - name: The push profile, for this certificate
        if: inputs.push
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" swift scripts/push-profile.swift "$CERT_SHA1" "$RUNNER_TEMP/push.provisionprofile"
          echo "PROFILE=$RUNNER_TEMP/push.provisionprofile" >> "$GITHUB_ENV"

      - name: Sign the app and pack the image
        env:
          PUSH: ${{ inputs.push && '1' || '0' }}
        run: scripts/dmg.sh

      - name: Notarize the image and staple its ticket
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          dmg=$(ls build/tafs-*.dmg)
          xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          status=$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || echo unknown)
          id=$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || echo "")
          echo "notarization $id: $status"
          if [ "$status" != "Accepted" ]; then
            [ -n "$id" ] && xcrun notarytool log "$id" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            echo "::error::Apple didn't accept the image ($status)"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          # As Gatekeeper judges a downloaded image.
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          shasum -a 256 "$dmg"

      # A draft, seen only by people with push access. A version already
      # released stops the run: App/Info.plist's version or build goes up first.
      - name: Attach it to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls build/tafs-*.dmg)
          name=$(basename "$dmg" .dmg)
          tag="v${name#tafs-}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$tag is already released. Raise the version or build in App/Info.plist."
            exit 1
          fi
          gh release create "$tag" "$dmg" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "tafs for macOS $tag" \
            --notes "For the team: signed with Developer ID, notarized and stapled. macOS 12 or later, Intel and Apple silicon. SHA-256: $(shasum -a 256 "$dmg" | cut -d' ' -f1)"

      - name: Remove the keychain and the key
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/push.provisionprofile"
